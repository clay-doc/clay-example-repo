# The documentation of Clay, built with Clay. Longer settings live in config/,
# see Configuration › clay.yaml › Settings in files of their own.
title: "Clay"
favicon: "logo.svg"
baseURL: "/clay-example-repo/"
siteURL: "https://clay-doc.github.io"
editURL: "https://github.com/clay-doc/clay-example-repo/edit/main/docs/"
# The real kit ID comes from the CLAY_FONTAWESOME_KIT secret in CI
fontawesomeKit: "set-in-ci"
version: "4.0"
languages: ["en", "de"]

navbar: config/navbar.yaml          # logo, source and links
messages: config/messages.yaml      # interface texts that differ from Clay's
variables: config/variables.yaml    # {{major}} and {{node}} in the docs
head: config/head.yaml              # tags in the head of every page

# Page views and searches without results, without cookies: clay.goatcounter.com
analytics:
  goatcounter:
    code: "clay"
# Writes Publishing › CLI Reference from Clay's own help before every build
generate:
  - node scripts/cli-reference.mjs
